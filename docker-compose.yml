services:
  postgres:
    image: postgres:14
    container_name: fanpulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-fanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanpulse}
    volumes:
      - fanpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fanpulse} -d ${POSTGRES_DB:-fanpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - fanpulse-net

  spring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fanpulse-spring
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-fanpulse}
      DB_USERNAME: ${POSTGRES_USER:-fanpulse}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-fanpulse}
      AI_SERVICE_URL: http://django-ai:8000
      AI_SERVICE_API_KEY: ${AI_API_KEY:-test-api-key}
      JWT_SECRET: ${JWT_SECRET:-default-dev-secret-key-256-bits-long-for-hs256-algorithm}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-test-google-client-id.apps.googleusercontent.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FANPULSE_SCHEDULER_LIVE_DISCOVERY_ENABLED: "${FANPULSE_SCHEDULER_LIVE_DISCOVERY_ENABLED:-true}"
      FANPULSE_SCHEDULER_METADATA_REFRESH_ENABLED: "${FANPULSE_SCHEDULER_METADATA_REFRESH_ENABLED:-true}"
      FANPULSE_SCHEDULER_LIVE_DISCOVERY_MAX_CONCURRENCY: "${FANPULSE_SCHEDULER_LIVE_DISCOVERY_MAX_CONCURRENCY:-2}"
      # 뉴스 동기화 수동 트리거는 기본 비활성이고, 활성화 시 전용 관리자 키가 필요하다.
      FANPULSE_NEWS_SYNC_MANUAL_TRIGGER_ENABLED: "${FANPULSE_NEWS_SYNC_MANUAL_TRIGGER_ENABLED:-false}"
      FANPULSE_SECURITY_ADMIN_API_KEY: "${FANPULSE_SECURITY_ADMIN_API_KEY:-}"
      FANPULSE_CHART_REFRESH_ENABLED: "${FANPULSE_CHART_REFRESH_ENABLED:-true}"
      FANPULSE_CHART_REFRESH_CRON: "${FANPULSE_CHART_REFRESH_CRON:-0 30 10 * * MON}"
      FANPULSE_CONCERT_INGESTION_ENABLED: "${FANPULSE_CONCERT_INGESTION_ENABLED:-true}"
      FANPULSE_CONCERT_INGESTION_CRON: "${FANPULSE_CONCERT_INGESTION_CRON:-0 0 3 * * *}"
      JAVA_TOOL_OPTIONS: "-Xmx512m -Xms256m"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 1536M
    networks:
      - fanpulse-net

  django-ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: fanpulse-django-ai
    ports:
      - "8000:8000"
    environment:
      USE_POSTGRES: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-fanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanpulse}
      DJANGO_DEBUG: "false"
      DJANGO_RUN_MIGRATIONS: "false"
      ALLOWED_HOSTS: "localhost,127.0.0.1,django-ai"
      AI_SERVICE_ACCEPTED_KEYS: ${AI_API_KEY:-test-api-key}
    depends_on:
      postgres:
        condition: service_healthy
      spring:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - fanpulse-net

  news-worker:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: fanpulse-news-worker
    command: ["sh", "/app/scripts/run_news_worker.sh"]
    environment:
      USE_POSTGRES: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-fanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanpulse}
      DJANGO_DEBUG: "false"
      NEWS_COLLECTION_PROVIDER: ${NEWS_COLLECTION_PROVIDER:-auto}
      NEWS_COLLECTION_INTERVAL_SECONDS: "${NEWS_COLLECTION_INTERVAL_SECONDS:-1800}"
      NEWS_COLLECTION_MAX_ARTISTS: "${NEWS_COLLECTION_MAX_ARTISTS:-30}"
      NEWS_COLLECTION_PER_ARTIST: "${NEWS_COLLECTION_PER_ARTIST:-10}"
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      django-ai:
        condition: service_healthy
      spring:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/scripts/check_news_worker.py"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - fanpulse-net

volumes:
  fanpulse_postgres_data:

networks:
  fanpulse-net:
    driver: bridge
