# Development profile settings
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

fanpulse:
  scheduler:
    news-sync:
      enabled: false  # 로컬 dev 환경에선 Django sidecar 가 항상 떠 있지 않으므로 기본 비활성
      # 관리자 API Key를 명시적으로 설정한 경우에만 수동 트리거를 활성화한다.
      manual-trigger-enabled: ${FANPULSE_NEWS_SYNC_MANUAL_TRIGGER_ENABLED:false}

logging:
  level:
    com.fanpulse: DEBUG
    org.hibernate.SQL: DEBUG
