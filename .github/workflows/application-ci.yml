name: 애플리케이션 검증

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 및 PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: fanpulse
          POSTGRES_USER: fanpulse
          POSTGRES_PASSWORD: fanpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fanpulse -d fanpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: fanpulse
      DB_USERNAME: fanpulse
      DB_PASSWORD: fanpulse
      AI_SERVICE_API_KEY: ci-test-api-key
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Java 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: backend/*.gradle*

      - name: 백엔드 전체 테스트
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend:
    name: 프론트 테스트 및 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 24 설정
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        working-directory: web
        run: npm ci

      - name: 전체 프론트 테스트
        working-directory: web
        run: npm test -- --run

      - name: TypeScript 검사
        working-directory: web
        run: npx tsc --noEmit

      - name: 프로덕션 빌드
        working-directory: web
        run: npm run build
